<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#EBE0C8"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <!-- Status bar -->
  <text x="195" y="50" font-family="sans-serif" font-size="14" fill="#3A2E1F" text-anchor="middle" opacity="0.6">9:41</text>
  <!-- Header -->
  <text x="30" y="110" font-family="serif" font-size="28" fill="#3A2E1F" font-weight="bold">我的旅程</text>
  <line x1="30" y1="125" x2="80" y2="125" stroke="#E07A3E" stroke-width="3" stroke-linecap="round"/>
  <!-- Trip Card 1 -->
  <rect x="20" y="160" width="350" height="110" rx="12" fill="#FBF6EC" stroke="#3A2E1F" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.9"/>
  <circle cx="55" cy="195" r="16" fill="#E07A3E" opacity="0.2"/>
  <text x="55" y="200" font-family="serif" font-size="14" fill="#E07A3E" text-anchor="middle">✈</text>
  <text x="85" y="195" font-family="serif" font-size="18" fill="#3A2E1F" font-weight="bold">海南五日游</text>
  <text x="85" y="220" font-family="sans-serif" font-size="12" fill="#3A2E1F" opacity="0.5">4 人 · 2026.07.20</text>
  <text x="85" y="245" font-family="serif" font-size="22" fill="#E07A3E" font-weight="bold">¥3,286.50</text>
  <text x="340" y="245" font-family="sans-serif" font-size="11" fill="#3A2E1F" opacity="0.4" text-anchor="end">未结算</text>
  <!-- Trip Card 2 -->
  <rect x="20" y="290" width="350" height="110" rx="12" fill="#FBF6EC" stroke="#3A2E1F" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.9"/>
  <circle cx="55" cy="325" r="16" fill="#3A6F5C" opacity="0.2"/>
  <text x="55" y="330" font-family="serif" font-size="14" fill="#3A6F5C" text-anchor="middle">🏔</text>
  <text x="85" y="325" font-family="serif" font-size="18" fill="#3A2E1F" font-weight="bold">云南大理行</text>
  <text x="85" y="350" font-family="sans-serif" font-size="12" fill="#3A2E1F" opacity="0.5">3 人 · 2026.06.15</text>
  <text x="85" y="375" font-family="serif" font-size="22" fill="#3A6F5C" font-weight="bold">¥2,150.00</text>
  <text x="340" y="375" font-family="sans-serif" font-size="11" fill="#3A6F5C" text-anchor="end">已结算</text>
  <!-- FAB -->
  <circle cx="340" cy="760" r="28" fill="#E07A3E"/>
  <text x="340" y="768" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle">+</text>
  <!-- Bottom hint -->
  <text x="195" y="680" font-family="sans-serif" font-size="13" fill="#3A2E1F" opacity="0.4" text-anchor="middle">创建新账本或输入加入码开始旅程</text>
</svg>
